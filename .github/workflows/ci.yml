name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_PROGRESS_BAR: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            python -m pip install --retries 5 --timeout 120 -r requirements.txt && break
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency installation failed after 3 attempts."
              exit 1
            fi
            echo "Retrying dependency installation after transient network failure..."
            sleep 5
          done
          python -m pip install --retries 5 --timeout 120 pytest ruff
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          PYTHONPATH: src
        run: pytest
